<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NarraScribe Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#F6F4F0;color:#1A1C22;min-height:100vh;}
input,select,textarea,button{font-family:'DM Sans',sans-serif;}
input:focus,select:focus,textarea:focus{outline:2px solid #3A5F8A;outline-offset:1px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#F6F4F0;}
::-webkit-scrollbar-thumb{background:#D8D4CC;border-radius:3px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const ADMIN_USER = "narrascribe_admin";
const ADMIN_PASS = "NSadmin2026";

const STATE_RULES = {
  Maryland: { consent: "One-party", warning: false, retention: "7 years (COMAR)", minors: "16+ can consent", substance: "42 CFR Part 2 applies", note: "MCMRA may be stricter than HIPAA in some cases." },
  Virginia: { consent: "One-party", warning: false, retention: "10 years", minors: "14+ can consent", substance: "42 CFR Part 2 applies", note: "Virginia Health Records Privacy Act." },
  "Washington D.C.": { consent: "One-party", warning: false, retention: "6 years minimum", minors: "12+ can consent", substance: "42 CFR Part 2 applies", note: "DC Mental Health Information Act — strong protections." },
  Pennsylvania: { consent: "TWO-PARTY", warning: true, retention: "7 years", minors: "14+ can consent", substance: "42 CFR Part 2 + PA Drug & Alcohol Act", note: "Both parties must consent to recording. 18 Pa. C.S. §5703." },
  Florida: { consent: "TWO-PARTY", warning: true, retention: "7 years", minors: "13+ can consent", substance: "42 CFR Part 2 applies", note: "Both parties must consent. FL Stat. §934.03." },
  California: { consent: "TWO-PARTY", warning: true, retention: "7 years", minors: "12+ can consent", substance: "42 CFR Part 2 + CMIA", note: "Strictest recording laws. CA Penal Code §632." },
  Delaware: { consent: "One-party", warning: false, retention: "7 years", minors: "12+ can consent", substance: "42 CFR Part 2 applies", note: "Closely follows HIPAA." },
  "New York": { consent: "One-party", warning: false, retention: "6-7 years", minors: "16+ can consent", substance: "42 CFR Part 2 + NY Mental Hygiene Law", note: "NY Mental Hygiene Law Article 33." },
  Texas: { consent: "One-party", warning: false, retention: "10 years", minors: "Varies by condition", substance: "42 CFR Part 2 applies", note: "Texas Medical Records Privacy Act." },
};

const REQUIRED_BAAS = ["Anthropic (Claude API)", "Supabase", "Deepgram", "Daily.co"];

const { useState, useEffect } = React;

function useLS(key, def) {
  const [val, setVal] = useState(() => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch { return def; } });
  const save = v => { setVal(v); try { localStorage.setItem(key, JSON.stringify(v)); } catch {} };
  return [val, save];
}

function Badge({ color, children }) {
  const c = { green: ["#E8F5EF","#2D7A4F"], amber: ["#FEF6E4","#B07D2A"], red: ["#FCEBEB","#A32D2D"], blue: ["#E8F1F8","#3A5F8A"], gray: ["#EEEBE5","#7A8592"] }[color] || ["#EEEBE5","#7A8592"];
  return <span style={{ fontSize:11, fontWeight:600, padding:"3px 10px", borderRadius:20, background:c[0], color:c[1] }}>{children}</span>;
}

function Card({ children, style }) {
  return <div style={{ background:"#FDFCFA", border:"1px solid #D8D4CC", borderRadius:14, padding:"1.25rem 1.4rem", marginBottom:"1.25rem", ...style }}>{children}</div>;
}

function Inp({ label, req, type="text", ...p }) {
  return <div style={{ marginBottom:"1rem" }}>
    {label && <label style={{ display:"block", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:"#445060", marginBottom:5 }}>{label}{req && <span style={{ color:"#A32D2D" }}> *</span>}</label>}
    <input type={type} style={{ width:"100%", padding:"10px 13px", borderRadius:9, border:"1px solid #D8D4CC", fontSize:14, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }} {...p} />
  </div>;
}

function Sel({ label, children, ...p }) {
  return <div style={{ marginBottom:"1rem" }}>
    {label && <label style={{ display:"block", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:"#445060", marginBottom:5 }}>{label}</label>}
    <select style={{ width:"100%", padding:"10px 13px", borderRadius:9, border:"1px solid #D8D4CC", fontSize:14, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }} {...p}>{children}</select>
  </div>;
}

function Btn({ children, onClick, variant="primary", style }) {
  const s = { primary:{background:"#1E1C18",color:"#8AAECE",border:"none"}, success:{background:"#4A9E75",color:"#fff",border:"none"}, outline:{background:"#E8F1F8",color:"#3A5F8A",border:"1px solid #C2D8EC"}, secondary:{background:"#F6F4F0",color:"#445060",border:"1px solid #D8D4CC"}, danger:{background:"#FCEBEB",color:"#A32D2D",border:"1px solid #F0BFBF"} }[variant];
  return <button onClick={onClick} style={{ padding:"11px 22px", borderRadius:9, cursor:"pointer", fontSize:14, fontWeight:600, fontFamily:"inherit", display:"inline-flex", alignItems:"center", gap:7, transition:"all .15s", ...s, ...style }}>{children}</button>;
}

function Check({ label, checked, onChange }) {
  return <div onClick={onChange} style={{ display:"flex", alignItems:"center", gap:10, padding:"0.7rem 0.9rem", borderRadius:9, border:`1px solid ${checked?"#B8DFC9":"#D8D4CC"}`, background:checked?"#E8F5EF":"#FDFCFA", cursor:"pointer", marginBottom:8 }}>
    <div style={{ width:20, height:20, borderRadius:5, border:`2px solid ${checked?"#4A9E75":"#D8D4CC"}`, background:checked?"#4A9E75":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
      {checked && <span style={{ color:"#fff", fontSize:13, fontWeight:700 }}>✓</span>}
    </div>
    <span style={{ fontSize:13, color:checked?"#2D7A4F":"#445060", textDecoration:checked?"line-through":"none", opacity:checked?0.75:1 }}>{label}</span>
  </div>;
}

function Login({ onLogin }) {
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState(false);
  const go = () => { if(u===ADMIN_USER&&p===ADMIN_PASS){onLogin();}else{setErr(true);} };
  return <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", background:"#1E1C18" }}>
    <div style={{ background:"#2A2825", border:"1px solid rgba(255,255,255,.08)", borderRadius:16, padding:"2.5rem", width:380 }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:"2rem" }}>
        <div style={{ width:34, height:34, background:"#5A7FA8", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center" }}><i className="ti ti-notes" style={{ fontSize:18, color:"#fff" }}/></div>
        <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:500, color:"#fff" }}>Narra<span style={{ color:"#8AAECE" }}>Scribe</span></span>
        <span style={{ fontSize:10, fontWeight:600, letterSpacing:"0.1em", textTransform:"uppercase", color:"#B07D2A", background:"rgba(176,125,42,.15)", border:"1px solid rgba(176,125,42,.25)", padding:"2px 8px", borderRadius:20 }}>Admin</span>
      </div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.9rem", fontWeight:300, color:"#fff", marginBottom:".4rem" }}>Admin access</div>
      <div style={{ fontSize:13, color:"rgba(255,255,255,.3)", marginBottom:"2rem" }}>Private portal — not linked publicly.</div>
      {[["Username","text",u,setU],["Password","password",p,setP]].map(([lbl,t,v,sv])=>(
        <div key={lbl} style={{ marginBottom:"1rem" }}>
          <label style={{ display:"block", fontSize:11, fontWeight:600, color:"rgba(255,255,255,.35)", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:5 }}>{lbl}</label>
          <input type={t} value={v} onChange={e=>sv(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder={lbl==="Username"?"narrascribe_admin":"••••••••"} style={{ width:"100%", padding:"11px 14px", borderRadius:9, border:"1px solid rgba(255,255,255,.1)", background:"rgba(255,255,255,.05)", color:"#fff", fontSize:14, fontFamily:"inherit" }}/>
        </div>
      ))}
      {err && <div style={{ fontSize:12, color:"#F0BFBF", background:"rgba(163,45,45,.2)", padding:"8px 12px", borderRadius:8, marginBottom:".75rem" }}>Incorrect credentials. Try again.</div>}
      <button onClick={go} style={{ width:"100%", padding:13, borderRadius:9, background:"#3A5F8A", color:"#fff", fontSize:14, fontWeight:600, border:"none", cursor:"pointer", fontFamily:"inherit" }}>Sign in to admin</button>
    </div>
  </div>;
}

function ClinicRow({ clinic, onClick }) {
  const [hov,setHov]=useState(false);
  const pct = clinic.steps ? Math.round(clinic.steps.filter(Boolean).length/clinic.steps.length*100) : 0;
  return <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
    style={{ display:"flex", alignItems:"center", gap:"1rem", padding:".9rem 1rem", border:`1px solid ${hov?"#8AAECE":"#D8D4CC"}`, borderRadius:11, background:hov?"#E8F1F8":"#FDFCFA", marginBottom:".65rem", cursor:"pointer", transition:"all .15s" }}>
    <div style={{ width:40, height:40, borderRadius:10, background:"#1E1C18", display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:700, color:"#8AAECE", flexShrink:0 }}>{(clinic.name||"?")[0]}</div>
    <div style={{ flex:1 }}>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22" }}>{clinic.name||"Unnamed clinic"}</div>
      <div style={{ fontSize:12, color:"#7A8592", marginTop:2 }}>{clinic.type==="solo"?"Solo":"Group"} · {clinic.clinicianCount||1} clinician{(clinic.clinicianCount||1)>1?"s":""}{clinic.adminName?" · "+clinic.adminName:""}</div>
    </div>
    <div style={{ display:"flex", alignItems:"center", gap:".5rem" }}>
      <Badge color={clinic.status==="active"?"green":"amber"}>{clinic.status==="active"?"Active":"Setup in progress"}</Badge>
      <Badge color="gray">{pct}% setup</Badge>
    </div>
    <i className="ti ti-chevron-right" style={{ color:"#AABAC8", fontSize:14 }}/>
  </div>;
}

function Dashboard({ clinics, onboard }) {
  const active=clinics.filter(c=>c.status==="active").length;
  const pending=clinics.filter(c=>c.status==="setup").length;
  const revenue=clinics.filter(c=>c.status==="active").reduce((a,c)=>{
    const base=c.type==="solo"?99:287; const extra=c.type==="group"?Math.max(0,(parseInt(c.clinicianCount)||3)-3)*35:0; return a+base+extra;
  },0);
  const stats=[{val:active,lbl:"Active clinics",delta:"↑ Growing",dc:"#4A9E75"},{val:clinics.reduce((a,c)=>a+(parseInt(c.clinicianCount)||1),0),lbl:"Total clinicians"},{val:`$${revenue.toLocaleString()}`,lbl:"Monthly revenue",delta:"/month",dc:"#3A5F8A"},{val:pending,lbl:"Pending setup",delta:pending>0?"Needs action":"All clear",dc:pending>0?"#B07D2A":"#4A9E75"}];
  return <div>
    <div style={{ marginBottom:"2rem" }}>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>Good morning, <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Ebony.</em></div>
      <div style={{ fontSize:13, color:"#7A8592" }}>Here's what's happening across your clinics.</div>
    </div>
    <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"1rem", marginBottom:"1.5rem" }}>
      {stats.map((s,i)=><div key={i} style={{ background:"#FDFCFA", border:"1px solid #D8D4CC", borderRadius:12, padding:"1.1rem 1.3rem" }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:400, color:"#1A1C22" }}>{s.val}</div>
        <div style={{ fontSize:12, color:"#7A8592", marginTop:2 }}>{s.lbl}</div>
        {s.delta&&<div style={{ fontSize:11, color:s.dc, marginTop:4 }}>{s.delta}</div>}
      </div>)}
    </div>
    <Card>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-building-hospital" style={{ fontSize:18, color:"#5A7FA8" }}/> Your clinics</div>
      {clinics.length===0?<div style={{ textAlign:"center", padding:"2rem", color:"#AABAC8", fontSize:14 }}><i className="ti ti-building-hospital" style={{ fontSize:32, display:"block", marginBottom:".5rem" }}/>No clinics yet. Click "Onboard New Clinic" to get started.</div>
      :clinics.map(c=><ClinicRow key={c.id} clinic={c} onClick={()=>onboard(c)}/>)}
    </Card>
    <Btn onClick={()=>onboard(null)}><i className="ti ti-plus"/> Onboard new clinic</Btn>
  </div>;
}

const SOLO_STEPS=["Workspace Setup","Clinician Profile","Shorthand Dictionary","Claim-Prep Profile","Walkthrough","Training Resources","Support Notes","Complete"];
const GROUP_STEPS=["Clinic Workspace","Clinician Invites","Admin Config","Shared Dictionary","Claim-Prep Profile","Team Onboarding","Support Notes","Complete"];

function WizardNav({ steps, current, done }) {
  return <div style={{ display:"flex", gap:0, marginBottom:"2rem", overflowX:"auto", paddingBottom:4 }}>
    {steps.map((s,i)=>{
      const d=done?.[i]; const a=i===current;
      return <div key={i} style={{ display:"flex", alignItems:"center", flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <div style={{ width:28, height:28, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, border:`2px solid ${d?"#4A9E75":a?"#1E1C18":"#D8D4CC"}`, background:d?"#4A9E75":a?"#1E1C18":"#fff", color:d?"#fff":a?"#8AAECE":"#AABAC8", flexShrink:0 }}>{d?"✓":i+1}</div>
          <span style={{ fontSize:11, color:d?"#4A9E75":a?"#1A1C22":"#AABAC8", fontWeight:a?600:400, whiteSpace:"nowrap" }}>{s}</span>
        </div>
        {i<steps.length-1&&<div style={{ width:20, height:1, background:d?"#4A9E75":"#D8D4CC", margin:"0 6px" }}/>}
      </div>;
    })}
  </div>;
}

function ShorthandStep({ data, updateData, checks, toggleCheck, shared }) {
  const key=shared?"shared_sh":"solo_sh";
  const [rows,setRows]=useState(data[key]||[{abbr:"pt",exp:"patient / client"},{abbr:"f/u",exp:"follow-up scheduled"},{abbr:"hw",exp:"homework assigned"},{abbr:"anx",exp:"anxiety symptoms present"},{abbr:"dep",exp:"depressive symptoms present"},{abbr:"SI",exp:"suicidal ideation"},{abbr:"CBT",exp:"Cognitive Behavioral Therapy utilized"},{abbr:"MI",exp:"Motivational Interviewing used"}]);
  const [test,setTest]=useState(""); const [out,setOut]=useState("");
  const save=r=>{setRows(r);updateData(key,r);};
  const runTest=()=>{let r=test;rows.forEach(row=>{if(row.abbr)r=r.replace(new RegExp(`\\b${row.abbr.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`,"gi"),row.exp);});setOut(r);};
  return <Card>
    <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-book" style={{ fontSize:18, color:"#5A7FA8" }}/> {shared?"Shared ":""}Shorthand Dictionary</div>
    <div style={{ background:"#E8F1F8", border:"1px solid #C2D8EC", borderRadius:10, padding:"1rem", marginBottom:"1rem", fontSize:13, color:"#445060", display:"flex", gap:8 }}><i className="ti ti-info-circle" style={{ fontSize:16, color:"#5A7FA8", flexShrink:0 }}/> Collect the clinician's shorthand terms. Test with a sample after setup.</div>
    <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:8 }}>
      <thead><tr>{["Shorthand","Expands to",""].map((h,i)=><th key={i} style={{ fontSize:11, color:"#7A8592", fontWeight:600, textAlign:"left", padding:"6px 8px", borderBottom:"1px solid #D8D4CC", width:i===2?"36px":i===0?"35%":undefined, textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r,i)=><tr key={i} style={{ borderBottom:"1px solid #EEEBE5" }}>
        <td style={{ padding:"4px 4px" }}><input value={r.abbr} onChange={e=>{const n=[...rows];n[i]={...n[i],abbr:e.target.value};save(n);}} style={{ width:"100%", padding:"6px 9px", borderRadius:7, border:"1px solid transparent", background:"transparent", fontSize:13, color:"#1A1C22", fontFamily:"inherit" }}/></td>
        <td style={{ padding:"4px 4px" }}><input value={r.exp} onChange={e=>{const n=[...rows];n[i]={...n[i],exp:e.target.value};save(n);}} style={{ width:"100%", padding:"6px 9px", borderRadius:7, border:"1px solid transparent", background:"transparent", fontSize:13, color:"#1A1C22", fontFamily:"inherit" }}/></td>
        <td style={{ padding:"4px 4px" }}><button onClick={()=>save(rows.filter((_,j)=>j!==i))} style={{ background:"none", border:"none", cursor:"pointer", color:"#AABAC8", fontSize:15, padding:"3px 6px" }}>✕</button></td>
      </tr>)}</tbody>
    </table>
    <button onClick={()=>save([...rows,{abbr:"",exp:""}])} style={{ width:"100%", padding:7, borderRadius:8, border:"1.5px dashed #D8D4CC", background:"transparent", fontSize:12, color:"#7A8592", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:5, fontFamily:"inherit" }}>+ Add term</button>
    <div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>
    <Inp label="Paste sample shorthand to test" value={test} onChange={e=>setTest(e.target.value)} placeholder="e.g. Ct anxious, CBT used, no SI, f/u in 2 wks"/>
    <Btn variant="outline" onClick={runTest}><i className="ti ti-wand"/> Test expansion</Btn>
    {out&&<div style={{ marginTop:"1rem", background:"#E8F1F8", border:"1px solid #C2D8EC", borderRadius:9, padding:"1rem 1.2rem" }}><div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", color:"#5A7FA8", marginBottom:".5rem" }}>Expanded output</div><div style={{ fontSize:13, color:"#1A1C22", lineHeight:1.7 }}>{out}</div></div>}
    <div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>
    {["Common shorthand terms collected","Abbreviations added to dictionary","Preferred clinical phrases added","Sample tested and confirmed","Clinician approved dictionary output"].map(item=><Check key={item} label={item} checked={!!checks[item]} onChange={()=>toggleCheck(item)}/>)}
  </Card>;
}

function ClaimStep({ data, updateData, checks, toggleCheck }) {
  const [cpts,setCpts]=useState(data.cpt_rows||[{code:"90837",desc:"Psychotherapy, 60 min",fee:"150.00"},{code:"90834",desc:"Psychotherapy, 45 min",fee:"125.00"},{code:"90832",desc:"Psychotherapy, 30 min",fee:"90.00"},{code:"90791",desc:"Psychiatric diagnostic evaluation",fee:"200.00"}]);
  const [prev,setPrev]=useState(false);
  const f=k=>data[k]||"";
  const i=(label,key,ph)=><Inp key={key} label={label} value={f(key)} onChange={e=>updateData(key,e.target.value)} placeholder={ph}/>;
  const saveCpts=c=>{setCpts(c);updateData("cpt_rows",c);};
  return <Card>
    <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-file-invoice" style={{ fontSize:18, color:"#5A7FA8" }}/> Claim-Prep Profile</div>
    <div style={{ background:"#E8F1F8", border:"1px solid #C2D8EC", borderRadius:10, padding:"1rem", marginBottom:"1rem", fontSize:13, color:"#445060", display:"flex", gap:8 }}><i className="ti ti-info-circle" style={{ fontSize:16, color:"#5A7FA8", flexShrink:0 }}/> These details pre-fill the CMS-1500 form automatically for this clinician.</div>
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
      {i("Provider last name","cl_prov_last","Rivera")}{i("Provider first name","cl_prov_first","Maria")}
      {i("NPI number","cl_npi","1234567890")}{i("Tax ID / EIN","cl_taxid","XX-XXXXXXX")}
      {i("Practice / billing name","cl_practice","Harmony Mental Health")}{i("Practice address","cl_address","123 Main St, City, MD 21201")}
      {i("Practice phone","cl_phone","(410) 555-0100")}
      <Sel label="Default place of service" value={f("cl_pos")} onChange={e=>updateData("cl_pos",e.target.value)}>
        <option value="11">11 — Office</option><option value="02">02 — Telehealth (patient home)</option><option value="10">10 — Telehealth (non-home)</option><option value="12">12 — Home</option>
      </Sel>
    </div>
    <div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>
    <div style={{ fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#7A8592", marginBottom:"1rem" }}>Default CPT codes</div>
    <div style={{ display:"grid", gridTemplateColumns:"120px 1fr 100px 36px", gap:8, marginBottom:6 }}>
      {["CPT code","Description","Fee ($)",""].map((h,i)=><div key={i} style={{ fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:"#7A8592" }}>{h}</div>)}
    </div>
    {cpts.map((row,i)=><div key={i} style={{ display:"grid", gridTemplateColumns:"120px 1fr 100px 36px", gap:8, marginBottom:6, alignItems:"center" }}>
      {["code","desc","fee"].map(k=><input key={k} value={row[k]} onChange={e=>{const n=[...cpts];n[i]={...n[i],[k]:e.target.value};saveCpts(n);}} placeholder={k==="code"?"CPT code":k==="desc"?"Description":"Fee"} style={{ padding:"9px 11px", borderRadius:8, border:"1px solid #D8D4CC", fontSize:13, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }}/>)}
      <button onClick={()=>saveCpts(cpts.filter((_,j)=>j!==i))} style={{ background:"none", border:"none", cursor:"pointer", color:"#AABAC8", fontSize:16, padding:"4px 6px" }}>✕</button>
    </div>)}
    <button onClick={()=>saveCpts([...cpts,{code:"",desc:"",fee:""}])} style={{ width:"100%", padding:7, borderRadius:8, border:"1.5px dashed #D8D4CC", background:"transparent", fontSize:12, color:"#7A8592", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:5, fontFamily:"inherit", marginTop:6 }}>+ Add CPT code</button>
    <div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>
    <Btn variant="outline" onClick={()=>setPrev(!prev)}><i className="ti ti-eye"/> {prev?"Hide":"Preview"} CMS-1500 form</Btn>
    {prev&&<div style={{ marginTop:"1.5rem", background:"#fff", border:"1px solid #ccc", borderRadius:8, padding:"1.5rem", fontFamily:"Arial,sans-serif", fontSize:11 }}>
      <div style={{ fontSize:14, fontWeight:700, textAlign:"center", marginBottom:4, letterSpacing:"0.05em" }}>HEALTH INSURANCE CLAIM FORM</div>
      <div style={{ textAlign:"center", fontSize:10, color:"#666", marginBottom:12, paddingBottom:8, borderBottom:"1px solid #ddd" }}>CMS-1500 — Pre-filled provider defaults · NarraScribe</div>
      <div style={{ fontWeight:700, fontSize:10, textTransform:"uppercase", background:"#f0f0f0", padding:"4px 8px", margin:"10px 0 6px" }}>Provider / Billing Information</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
        {[["Provider",`${f("cl_prov_first")} ${f("cl_prov_last")}`],["Practice",f("cl_practice")],["NPI",f("cl_npi")],["Tax ID",f("cl_taxid")],["Address",f("cl_address")],["Phone",f("cl_phone")]].map(([k,v])=>(
          <div key={k} style={{ border:"1px solid #ccc", borderRadius:3, padding:"4px 7px" }}><div style={{ fontSize:8, textTransform:"uppercase", color:"#888", marginBottom:1 }}>{k}</div><div style={{ fontSize:11, fontWeight:600 }}>{v||"—"}</div></div>
        ))}
      </div>
      <div style={{ fontWeight:700, fontSize:10, textTransform:"uppercase", background:"#f0f0f0", padding:"4px 8px", margin:"10px 0 6px" }}>Default CPT Codes</div>
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
        <thead><tr>{["CPT","Description","Fee"].map(h=><th key={h} style={{ border:"1px solid #ddd", padding:"4px 6px", background:"#f5f5f5", textAlign:"left" }}>{h}</th>)}</tr></thead>
        <tbody>{cpts.filter(r=>r.code).map((r,i)=><tr key={i}><td style={{ border:"1px solid #ddd", padding:"4px 6px" }}>{r.code}</td><td style={{ border:"1px solid #ddd", padding:"4px 6px" }}>{r.desc}</td><td style={{ border:"1px solid #ddd", padding:"4px 6px" }}>${r.fee}</td></tr>)}</tbody>
      </table>
    </div>}
    <div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>
    {["Provider name and NPI entered","Tax ID confirmed","Default CPT codes added","Place of service set correctly","Claim preview confirmed accurate"].map(item=><Check key={item} label={item} checked={!!checks[item]} onChange={()=>toggleCheck(item)}/>)}
  </Card>;
}

function OnboardWizard({ clinics, setClinics, init, onDone }) {
  const [type,setType]=useState(init?.type||null);
  const [step,setStep]=useState(init?.lastStep||0);
  const [clinic,setClinic]=useState(init||{});
  const [data,setData]=useState(init?.data||{});
  const [checks,setChecks]=useState(init?.checks||{});
  const steps=type==="solo"?SOLO_STEPS:GROUP_STEPS;
  const upd=(k,v)=>setData(d=>({...d,[k]:v}));
  const tog=k=>setChecks(c=>({...c,[k]:!c[k]}));
  const f=k=>data[k]||"";

  const saveNext=()=>{
    const newSteps=[...(clinic.steps||Array(steps.length).fill(false))];
    newSteps[step]=true;
    const updated={...clinic,type,data,checks,steps:newSteps,lastStep:step+1,
      name:data.ws_clinic_name||data.gw_clinic_name||clinic.name,
      adminName:data.ws_admin_name||data.gw_admin_name||clinic.adminName,
      clinicianCount:data.gw_count||clinic.clinicianCount||1,
      id:clinic.id||"clinic_"+Date.now(),
      status:step===steps.length-2?"active":"setup"};
    setClinic(updated);
    const all=clinics.filter(c=>c.id!==updated.id);
    all.push(updated);
    setClinics(all);
    if(step===steps.length-2){onDone();}else{setStep(s=>s+1);}
  };

  const secDiv=()=><div style={{ height:1, background:"#D8D4CC", margin:"1.25rem 0" }}/>;
  const secLbl=t=><div style={{ fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#7A8592", marginBottom:"1rem" }}>{t}</div>;
  const checklist=(items)=>items.map(item=><Check key={item} label={item} checked={!!checks[item]} onChange={()=>tog(item)}/>);
  const infoBox=msg=><div style={{ background:"#E8F1F8", border:"1px solid #C2D8EC", borderRadius:10, padding:"1rem", marginBottom:"1rem", fontSize:13, color:"#445060", display:"flex", gap:8 }}><i className="ti ti-info-circle" style={{ fontSize:16, color:"#5A7FA8", flexShrink:0 }}/>{msg}</div>;

  if(!type) return <div>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>Onboard <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>New Clinic</em></div>
    <div style={{ fontSize:13, color:"#7A8592", marginBottom:"2rem" }}>Select the clinic type to begin.</div>
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"1rem", maxWidth:520 }}>
      {[{t:"solo",icon:"ti-user-heart",title:"Solo Clinician",desc:"1 clinician · $99/mo",fee:"$500 setup fee"},{t:"group",icon:"ti-building-hospital",title:"Group Practice",desc:"3+ clinicians · $287/mo",fee:"$900 setup fee"}].map(opt=>(
        <div key={opt.t} onClick={()=>setType(opt.t)} style={{ cursor:"pointer", padding:"2rem", border:"2px solid #D8D4CC", borderRadius:14, background:"#FDFCFA", textAlign:"center", transition:"all .2s" }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#8AAECE";e.currentTarget.style.background="#E8F1F8";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="#D8D4CC";e.currentTarget.style.background="#FDFCFA";}}>
          <i className={`ti ${opt.icon}`} style={{ fontSize:36, color:"#5A7FA8", display:"block", marginBottom:".75rem" }}/>
          <div style={{ fontSize:16, fontWeight:600, color:"#1A1C22", marginBottom:".25rem" }}>{opt.title}</div>
          <div style={{ fontSize:13, color:"#7A8592" }}>{opt.desc}</div>
          <div style={{ fontSize:12, color:"#B07D2A", marginTop:".5rem" }}>{opt.fee}</div>
        </div>
      ))}
    </div>
  </div>;

  const soloPanel=()=>{
    if(step===7) return <div style={{ textAlign:"center", padding:"3rem 2rem" }}>
      <div style={{ width:72, height:72, borderRadius:"50%", background:"#E8F5EF", border:"2px solid #4A9E75", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 1.25rem" }}><i className="ti ti-circle-check" style={{ fontSize:32, color:"#4A9E75" }}/></div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".5rem" }}>Setup complete!</div>
      <div style={{ fontSize:14, color:"#7A8592", maxWidth:420, margin:"0 auto 1.5rem" }}>{clinic.name||"This clinic"} is fully onboarded and active.</div>
      <Card style={{ textAlign:"left", maxWidth:440, margin:"0 auto 1.5rem" }}>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Setup summary</div>
        {[["Clinic",data.ws_clinic_name||"—"],["Admin",data.ws_admin_name||"—"],["Provider",`${data.cp_first||""} ${data.cp_last||""}`.trim()||"—"],["NPI",data.cp_npi||"—"],["Note format",data.cp_format||"SOAP"],["Plan","Solo — $99/mo"],["Setup fee","$500"]].map(([k,v])=>(
          <div key={k} style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#445060", padding:"4px 0", borderBottom:"1px solid #EEEBE5" }}>
            <span style={{ color:"#7A8592" }}>{k}</span><span style={{ fontWeight:600 }}>{v}</span>
          </div>
        ))}
      </Card>
      <Btn variant="success" onClick={onDone}><i className="ti ti-check"/> Go to dashboard</Btn>
    </div>;

    const panels=[
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-building" style={{ fontSize:18, color:"#5A7FA8" }}/> Workspace Setup</div>
        {infoBox("Enter the clinic's basic workspace details.")}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Inp label="Clinic / practice name" req value={f("ws_clinic_name")} onChange={e=>upd("ws_clinic_name",e.target.value)} placeholder="Harmony Mental Health"/>
          <Inp label="Owner / admin name" req value={f("ws_admin_name")} onChange={e=>upd("ws_admin_name",e.target.value)} placeholder="Full name"/>
          <Inp label="Admin email" req type="email" value={f("ws_admin_email")} onChange={e=>upd("ws_admin_email",e.target.value)} placeholder="owner@clinic.com"/>
          <Inp label="Phone" value={f("ws_phone")} onChange={e=>upd("ws_phone",e.target.value)} placeholder="(410) 555-0100"/>
          <Sel label="Subscription plan"><option>Solo — $99/mo</option></Sel>
          <Sel label="Setup fee collected?" value={f("ws_fee")} onChange={e=>upd("ws_fee",e.target.value)}><option value="yes">Yes — $500</option><option value="no">Not yet</option></Sel>
        </div>
        {secDiv()}{secLbl("Setup checklist")}
        {checklist(["Create clinician account in system","Connect account to Solo subscription","Set up secure login credentials","Confirm dashboard access","Confirm note generator access","Confirm CMS-1500 claim-prep access"])}
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-user-heart" style={{ fontSize:18, color:"#5A7FA8" }}/> Clinician Profile</div>
        {infoBox("This info appears inside generated notes and CMS-1500 forms.")}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Inp label="First name" req value={f("cp_first")} onChange={e=>upd("cp_first",e.target.value)} placeholder="Maria"/>
          <Inp label="Last name" req value={f("cp_last")} onChange={e=>upd("cp_last",e.target.value)} placeholder="Rivera"/>
          <Sel label="Credential" req value={f("cp_credential")} onChange={e=>upd("cp_credential",e.target.value)}>{["LCSW","LPC","LMFT","PhD","PsyD","MD","LCPC","MSW","Other"].map(c=><option key={c}>{c}</option>)}</Sel>
          <Inp label="License number" value={f("cp_license")} onChange={e=>upd("cp_license",e.target.value)} placeholder="MD-LCSW-44821"/>
          <Inp label="NPI number" value={f("cp_npi")} onChange={e=>upd("cp_npi",e.target.value)} placeholder="1234567890"/>
          <Inp label="Tax ID / EIN" value={f("cp_taxid")} onChange={e=>upd("cp_taxid",e.target.value)} placeholder="XX-XXXXXXX"/>
          <Inp label="Practice name" value={f("cp_practice")} onChange={e=>upd("cp_practice",e.target.value)} placeholder="Harmony Mental Health"/>
          <Inp label="Practice address" value={f("cp_address")} onChange={e=>upd("cp_address",e.target.value)} placeholder="123 Main St, City, MD 21201"/>
          <Inp label="Practice phone" value={f("cp_phone")} onChange={e=>upd("cp_phone",e.target.value)} placeholder="(410) 555-0100"/>
          <Sel label="Preferred note format" value={f("cp_format")} onChange={e=>upd("cp_format",e.target.value)}>{["SOAP","DAP","BIRP","GIRP"].map(x=><option key={x}>{x}</option>)}</Sel>
        </div>
        {secDiv()}
        {checklist(["Clinician name and credentials entered","NPI number confirmed","Practice details saved","Profile appears correctly in note header","Preferred note format confirmed"])}
      </Card>,
      <ShorthandStep data={data} updateData={upd} checks={checks} toggleCheck={tog}/>,
      <ClaimStep data={data} updateData={upd} checks={checks} toggleCheck={tog}/>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-presentation" style={{ fontSize:18, color:"#5A7FA8" }}/> Onboarding Walkthrough</div>
        {checklist(["Walked through typing shorthand notes","Demonstrated voice input feature","Showed how to upload existing notes","Generated a sample clinical note live","Generated a sample CMS-1500 draft","Showed where saved notes and dictionaries live","Answered clinician workflow questions","Clinician generated their first note independently"])}
        {secDiv()}
        <Inp label="Walkthrough notes" value={f("walkthrough_notes")} onChange={e=>upd("walkthrough_notes",e.target.value)} placeholder="Questions raised, preferences, follow-ups..."/>
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-send" style={{ fontSize:18, color:"#5A7FA8" }}/> Training Resources</div>
        {checklist(["Quick-start guide sent","Demo video or walkthrough link sent","Shorthand dictionary tips sent","Best-practice note examples sent","Support contact instructions sent"])}
        {secDiv()}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Inp label="Email used" value={f("resource_email")} onChange={e=>upd("resource_email",e.target.value)} placeholder="clinician@practice.com"/>
          <Inp label="Date sent" type="date" value={f("resource_date")} onChange={e=>upd("resource_date",e.target.value)}/>
        </div>
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-headset" style={{ fontSize:18, color:"#5A7FA8" }}/> Support Notes</div>
        {checklist(["Helped resolve any login issues","Adjusted dictionary terms as needed","Clarified note outputs with clinician","Clinician using system independently"])}
        {secDiv()}
        {[["Login issues","support_login"],["Dictionary adjustments","support_dict"],["Note output feedback","support_notes"],["Follow-up actions","support_followup"]].map(([lbl,key])=>(
          <Inp key={key} label={lbl} value={f(key)} onChange={e=>upd(key,e.target.value)} placeholder={`Notes on ${lbl.toLowerCase()}...`}/>
        ))}
      </Card>,
    ];
    return panels[step];
  };

  const groupPanel=()=>{
    if(step===7) return soloPanel();
    const panels=[
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-building-hospital" style={{ fontSize:18, color:"#5A7FA8" }}/> Clinic Workspace Setup</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Inp label="Clinic / practice name" req value={f("gw_clinic_name")} onChange={e=>upd("gw_clinic_name",e.target.value)} placeholder="Harmony Mental Health Clinic"/>
          <Inp label="Primary admin name" req value={f("gw_admin_name")} onChange={e=>upd("gw_admin_name",e.target.value)} placeholder="Full name"/>
          <Inp label="Admin email" req type="email" value={f("gw_admin_email")} onChange={e=>upd("gw_admin_email",e.target.value)} placeholder="owner@clinic.com"/>
          <Inp label="Phone" value={f("gw_phone")} onChange={e=>upd("gw_phone",e.target.value)} placeholder="(410) 555-0100"/>
          <Sel label="Number of clinicians" value={f("gw_count")||"3"} onChange={e=>upd("gw_count",e.target.value)}>
            {["3","4","5","6","7","8","9","10"].map(n=><option key={n} value={n}>{n} clinicians{n>"3"?` (+$${(n-3)*35}/mo)`:" (base)"}</option>)}
          </Sel>
          <div><label style={{ display:"block", fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:"#445060", marginBottom:5 }}>Monthly total</label>
          <div style={{ padding:"10px 13px", borderRadius:9, border:"1px solid #D8D4CC", fontSize:14, background:"#EEEBE5", color:"#1A1C22" }}>${287+Math.max(0,(parseInt(f("gw_count"))||3)-3)*35}/month</div></div>
          <Sel label="Setup fee collected?" value={f("gw_fee")} onChange={e=>upd("gw_fee",e.target.value)}><option value="yes">Yes — $900</option><option value="no">Not yet</option></Sel>
        </div>
        {secDiv()}
        {checklist(["Clinic workspace created","Clinic name and admin added","Subscription plan connected","Clinician seat count set","Admin dashboard access confirmed"])}
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-users" style={{ fontSize:18, color:"#5A7FA8" }}/> Clinician Invitations</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 120px 100px 36px", gap:8, marginBottom:6 }}>
          {["Full name","Email","Credential","Role",""].map((h,i)=><div key={i} style={{ fontSize:11, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.07em", color:"#7A8592" }}>{h}</div>)}
        </div>
        {(data.clinician_roster||[{},{},{}]).map((row,i)=>(
          <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr 1fr 120px 100px 36px", gap:8, marginBottom:8, alignItems:"center" }}>
            <input value={row.name||""} onChange={e=>{const n=[...(data.clinician_roster||[{},{},{}])];n[i]={...n[i],name:e.target.value};upd("clinician_roster",n);}} placeholder="Full name" style={{ padding:"9px 11px", borderRadius:8, border:"1px solid #D8D4CC", fontSize:13, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }}/>
            <input value={row.email||""} onChange={e=>{const n=[...(data.clinician_roster||[{},{},{}])];n[i]={...n[i],email:e.target.value};upd("clinician_roster",n);}} placeholder="Email" style={{ padding:"9px 11px", borderRadius:8, border:"1px solid #D8D4CC", fontSize:13, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }}/>
            <select value={row.cred||"LCSW"} onChange={e=>{const n=[...(data.clinician_roster||[{},{},{}])];n[i]={...n[i],cred:e.target.value};upd("clinician_roster",n);}} style={{ padding:"9px 11px", borderRadius:8, border:"1px solid #D8D4CC", fontSize:13, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }}>
              {["LCSW","LPC","LMFT","PhD","PsyD","LCPC","Other"].map(c=><option key={c}>{c}</option>)}
            </select>
            <select value={row.role||"Clinician"} onChange={e=>{const n=[...(data.clinician_roster||[{},{},{}])];n[i]={...n[i],role:e.target.value};upd("clinician_roster",n);}} style={{ padding:"9px 11px", borderRadius:8, border:"1px solid #D8D4CC", fontSize:13, background:"#FDFCFA", color:"#1A1C22", fontFamily:"inherit" }}>
              <option>Clinician</option><option>Admin</option>
            </select>
            <button onClick={()=>{const n=(data.clinician_roster||[{},{},{}]).filter((_,j)=>j!==i);upd("clinician_roster",n);}} style={{ background:"none", border:"none", cursor:"pointer", color:"#AABAC8", fontSize:16 }}>✕</button>
          </div>
        ))}
        <button onClick={()=>upd("clinician_roster",[...(data.clinician_roster||[{},{},{}]),{name:"",email:"",cred:"LCSW",role:"Clinician"}])} style={{ padding:"7px 14px", borderRadius:8, border:"1.5px dashed #D8D4CC", background:"transparent", fontSize:12, color:"#7A8592", cursor:"pointer", fontFamily:"inherit" }}>+ Add clinician</button>
        {secDiv()}
        {checklist(["All clinician names and emails collected","Clinician profiles created in system","Each clinician assigned to clinic","Roles set (admin or clinician)","Invite links sent to all clinicians","All clinicians confirmed account activation"])}
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-shield-check" style={{ fontSize:18, color:"#5A7FA8" }}/> Admin Configuration</div>
        {checklist(["Admin access to team management enabled","Admin can view full clinician list","Admin can manage workspace settings","Clinician access restricted to own notes","Admin can invite and remove clinicians","Admin confirmed access to all settings"])}
        {secDiv()}
        <Inp label="Admin configuration notes" value={f("admin_config_notes")} onChange={e=>upd("admin_config_notes",e.target.value)} placeholder="Any specific permissions or restrictions requested..."/>
      </Card>,
      <ShorthandStep data={data} updateData={upd} checks={checks} toggleCheck={tog} shared/>,
      <ClaimStep data={data} updateData={upd} checks={checks} toggleCheck={tog}/>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-presentation" style={{ fontSize:18, color:"#5A7FA8" }}/> Team Onboarding Session</div>
        {checklist(["Walked through clinician dashboard","Showed how to type shorthand","Showed how to upload notes","Showed voice input feature","Generated sample notes with team","Generated sample CMS-1500 drafts","Reviewed dictionary workflow","Answered all team questions"])}
        {secDiv()}
        <Inp label="Session notes" value={f("team_session_notes")} onChange={e=>upd("team_session_notes",e.target.value)} placeholder="Questions raised, preferences, follow-ups..."/>
      </Card>,
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem", display:"flex", alignItems:"center", gap:8 }}><i className="ti ti-headset" style={{ fontSize:18, color:"#5A7FA8" }}/> Support Notes</div>
        {checklist(["Helped all clinicians activate accounts","Resolved any access issues","Adjusted shorthand/dictionary terms","Refined sample note outputs","Admin questions answered","Team using system independently"])}
        {secDiv()}
        <Inp label="Follow-up actions" value={f("support_followup")} onChange={e=>upd("support_followup",e.target.value)} placeholder="Anything to follow up on..."/>
      </Card>,
    ];
    return panels[step];
  };

  const panel=type==="solo"?soloPanel():groupPanel();

  return <div>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:"1.5rem" }}>
      Onboarding — <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>{type==="solo"?"Solo":"Group"}</em>
    </div>
    <WizardNav steps={steps} current={step} done={clinic.steps}/>
    {panel}
    {step<steps.length-1&&<div style={{ display:"flex", gap:10, marginTop:"1.5rem", paddingTop:"1.5rem", borderTop:"1px solid #D8D4CC" }}>
      {step>0&&<Btn variant="secondary" onClick={()=>setStep(s=>s-1)}><i className="ti ti-arrow-left"/> Back</Btn>}
      <Btn onClick={saveNext}><i className="ti ti-arrow-right"/> Save &amp; continue</Btn>
    </div>}
  </div>;
}

function ComplianceScreen({ clinics }) {
  const [selClinic,setSelClinic]=useState("");
  const [state,setState]=useState("Maryland");
  const [form,setForm]=useState({ careStates:"", minors:false, substance:false, psychNotes:false, recording:false, claims:true, telehealth:false, notes:"" });
  const [profiles,setProfiles]=useLS("ns_compliance",[]);
  const rules=STATE_RULES[state]||{};
  const save=()=>{ if(!selClinic)return alert("Select a clinic first"); const all=profiles.filter(p=>p.clinicId!==selClinic); all.push({clinicId:selClinic,state,...form,savedAt:new Date().toISOString()}); setProfiles(all); alert("Compliance profile saved!"); };
  const getClinicName=id=>(clinics.find(c=>c.id===id)||{}).name||"Unknown";
  return <div>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>Compliance <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Profiles</em></div>
    <div style={{ fontSize:13, color:"#7A8592", marginBottom:"2rem" }}>State-based compliance settings per clinic.</div>
    <Card>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Sel label="Clinic" value={selClinic} onChange={e=>setSelClinic(e.target.value)}><option value="">Select clinic...</option>{clinics.map(c=><option key={c.id} value={c.id}>{c.name||"Unnamed"}</option>)}</Sel>
        <Sel label="Practice state" value={state} onChange={e=>setState(e.target.value)}>{Object.keys(STATE_RULES).map(s=><option key={s}>{s}</option>)}</Sel>
      </div>
      <Inp label="States where clinicians provide care" value={form.careStates} onChange={e=>setForm(f=>({...f,careStates:e.target.value}))} placeholder="e.g. Maryland, Virginia, DC"/>
      <div style={{ height:1, background:"#D8D4CC", margin:"1rem 0" }}/>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:"1rem" }}>
        {[["minors","Serves minors (under 18)"],["substance","Substance-use treatment (42 CFR Part 2)"],["psychNotes","Stores psychotherapy notes separately"],["recording","Uses session recording / transcription"],["claims","Uses CMS-1500 claim prep"],["telehealth","Provides telehealth services"]].map(([key,lbl])=>(
          <label key={key} style={{ display:"flex", alignItems:"center", gap:8, fontSize:13, color:"#445060", cursor:"pointer" }}>
            <input type="checkbox" checked={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.checked}))} style={{ accentColor:"#3A5F8A", width:16, height:16 }}/> {lbl}
          </label>
        ))}
      </div>
      {rules.consent&&<div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:"1rem" }}>
        <div style={{ background:rules.warning?"#FCEBEB":"#E8F5EF", border:`1px solid ${rules.warning?"#F0BFBF":"#B8DFC9"}`, borderRadius:8, padding:".75rem" }}>
          <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", color:rules.warning?"#A32D2D":"#2D7A4F", marginBottom:4 }}>Recording consent</div>
          <div style={{ fontSize:12, color:"#1A1C22" }}>{rules.warning?"⚠️ ":""}{rules.consent} consent — {rules.note}</div>
        </div>
        <div style={{ background:"#E8F1F8", border:"1px solid #C2D8EC", borderRadius:8, padding:".75rem" }}>
          <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", color:"#3A5F8A", marginBottom:4 }}>Data retention</div>
          <div style={{ fontSize:12, color:"#1A1C22" }}>{rules.retention}</div>
        </div>
        <div style={{ background:"#EEEBE5", border:"1px solid #D8D4CC", borderRadius:8, padding:".75rem" }}>
          <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", color:"#7A8592", marginBottom:4 }}>Minors</div>
          <div style={{ fontSize:12, color:"#1A1C22" }}>{rules.minors}</div>
        </div>
        <div style={{ background:"#EEEBE5", border:"1px solid #D8D4CC", borderRadius:8, padding:".75rem" }}>
          <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em", color:"#7A8592", marginBottom:4 }}>Substance use</div>
          <div style={{ fontSize:12, color:"#1A1C22" }}>{rules.substance}</div>
        </div>
      </div>}
      <Inp label="Additional compliance notes" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Any additional considerations..."/>
      <Btn onClick={save}><i className="ti ti-check"/> Save compliance profile</Btn>
    </Card>
    {profiles.map(p=><Card key={p.clinicId}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"1rem" }}>
        <div><div style={{ fontSize:15, fontWeight:600 }}>{getClinicName(p.clinicId)}</div><div style={{ fontSize:12, color:"#7A8592" }}>State: {p.state} · Updated {new Date(p.savedAt).toLocaleDateString()}</div></div>
        <Badge color={STATE_RULES[p.state]?.warning&&p.recording?"amber":"green"}>{STATE_RULES[p.state]?.warning&&p.recording?"⚠️ Recording consent required":"Compliant"}</Badge>
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
        {p.minors&&<Badge color="blue">Serves minors</Badge>}
        {p.substance&&<Badge color="blue">42 CFR Part 2</Badge>}
        {p.recording&&<Badge color="blue">Session recording</Badge>}
        {p.telehealth&&<Badge color="blue">Telehealth</Badge>}
        {p.claims&&<Badge color="blue">CMS-1500</Badge>}
      </div>
    </Card>)}
  </div>;
}

function BAAScreen() {
  const [baas,setBaas]=useLS("ns_baas",[]);
  const [form,setForm]=useState({vendor:"",status:"Signed",date:"",renewal:"",phi:"",contact:"",notes:""});
  const missing=REQUIRED_BAAS.filter(r=>!baas.some(b=>b.vendor.toLowerCase().includes(r.split(" ")[0].toLowerCase())));
  const save=()=>{ if(!form.vendor)return alert("Enter a vendor name"); setBaas([...baas,{...form,id:"baa_"+Date.now()}]); setForm({vendor:"",status:"Signed",date:"",renewal:"",phi:"",contact:"",notes:""}); };
  return <div>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>BAA <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Tracker</em></div>
    <div style={{ fontSize:13, color:"#7A8592", marginBottom:"2rem" }}>Track Business Associate Agreements with all vendors handling PHI.</div>
    {missing.length>0&&<div style={{ background:"#FEF6E4", border:"1px solid #E8D098", borderRadius:10, padding:"1rem 1.2rem", marginBottom:"1.5rem", fontSize:13, color:"#B07D2A", display:"flex", gap:8 }}><i className="ti ti-alert-triangle" style={{ fontSize:16, flexShrink:0 }}/><strong>BAAs still needed:</strong> {missing.join(", ")}</div>}
    {baas.length>0&&<Card>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Signed BAAs</div>
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
        <thead><tr style={{ borderBottom:"1px solid #D8D4CC" }}>{["Vendor","Status","Date signed","Renewal","PHI covered"].map(h=><th key={h} style={{ padding:8, textAlign:"left", fontSize:11, color:"#7A8592", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}</tr></thead>
        <tbody>{baas.map((b,i)=><tr key={i} style={{ borderBottom:"1px solid #EEEBE5" }}>
          <td style={{ padding:8, fontWeight:600 }}>{b.vendor}</td>
          <td style={{ padding:8, color:b.status==="Signed"?"#4A9E75":b.status==="Pending"?"#B07D2A":"#A32D2D", fontWeight:600 }}>{b.status}</td>
          <td style={{ padding:8 }}>{b.date||"—"}</td>
          <td style={{ padding:8 }}>{b.renewal||"—"}</td>
          <td style={{ padding:8, color:"#7A8592", fontSize:12 }}>{b.phi||"—"}</td>
        </tr>)}</tbody>
      </table>
    </Card>}
    <Card>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Add BAA record</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Inp label="Vendor name" req value={form.vendor} onChange={e=>setForm(f=>({...f,vendor:e.target.value}))} placeholder="e.g. Anthropic, Supabase, Deepgram"/>
        <Sel label="Status" value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option>Signed</option><option>Pending</option><option>Not started</option><option>Not required</option></Sel>
        <Inp label="Date signed" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
        <Inp label="Renewal date" type="date" value={form.renewal} onChange={e=>setForm(f=>({...f,renewal:e.target.value}))}/>
        <Inp label="PHI types covered" value={form.phi} onChange={e=>setForm(f=>({...f,phi:e.target.value}))} placeholder="e.g. Clinical notes, audio"/>
        <Inp label="Contact at vendor" value={form.contact} onChange={e=>setForm(f=>({...f,contact:e.target.value}))} placeholder="Name or email"/>
      </div>
      <Inp label="Notes" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Any notes..."/>
      <Btn onClick={save}><i className="ti ti-check"/> Save BAA record</Btn>
    </Card>
  </div>;
}

function ConsentScreen({ clinics }) {
  const [consents,setConsents]=useLS("ns_consents",[]);
  const [form,setForm]=useState({clinicId:"",client:"",type:"General treatment consent",signed:"yes",date:"",expiry:"",clinician:"",recording:"na",notes:""});
  const save=()=>{ if(!form.clinicId||!form.client)return alert("Select a clinic and enter a client ID"); setConsents([{...form,id:"con_"+Date.now(),savedAt:new Date().toISOString()},...consents]); setForm(f=>({...f,client:"",notes:""})); };
  const getClinicName=id=>(clinics.find(c=>c.id===id)||{}).name||"—";
  return <div>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>Consent <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Records</em></div>
    <div style={{ fontSize:13, color:"#7A8592", marginBottom:"2rem" }}>Track client consent per clinic before any recording or sensitive data processing.</div>
    <Card>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Add consent record</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Sel label="Clinic" req value={form.clinicId} onChange={e=>setForm(f=>({...f,clinicId:e.target.value}))}><option value="">Select clinic...</option>{clinics.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</Sel>
        <Inp label="Client ID / name" req value={form.client} onChange={e=>setForm(f=>({...f,client:e.target.value}))} placeholder="Client identifier"/>
        <Sel label="Consent type" value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
          {["General treatment consent","Recording consent","Telehealth consent","Minor treatment consent","Substance-use treatment consent (42 CFR Part 2)","Data sharing consent"].map(t=><option key={t}>{t}</option>)}
        </Sel>
        <Sel label="Consent signed?" value={form.signed} onChange={e=>setForm(f=>({...f,signed:e.target.value}))}><option value="yes">Yes — signed</option><option value="no">No — pending</option><option value="verbal">Verbal — documented</option></Sel>
        <Inp label="Date signed" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
        <Inp label="Expiration date" type="date" value={form.expiry} onChange={e=>setForm(f=>({...f,expiry:e.target.value}))}/>
        <Inp label="Clinician who collected consent" value={form.clinician} onChange={e=>setForm(f=>({...f,clinician:e.target.value}))} placeholder="Clinician name"/>
        <Sel label="Recording consent?" value={form.recording} onChange={e=>setForm(f=>({...f,recording:e.target.value}))}><option value="na">N/A</option><option value="yes">Yes — signed</option><option value="no">No</option></Sel>
      </div>
      <Inp label="Notes" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Any notes..."/>
      <Btn onClick={save}><i className="ti ti-check"/> Save consent record</Btn>
    </Card>
    {consents.length>0&&<Card>
      <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Consent records</div>
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
        <thead><tr style={{ borderBottom:"1px solid #D8D4CC" }}>{["Clinic","Client ID","Type","Status","Date","Recording"].map(h=><th key={h} style={{ padding:8, textAlign:"left", fontSize:11, color:"#7A8592", textTransform:"uppercase", letterSpacing:"0.06em" }}>{h}</th>)}</tr></thead>
        <tbody>{consents.map((c,i)=><tr key={i} style={{ borderBottom:"1px solid #EEEBE5" }}>
          <td style={{ padding:8 }}>{getClinicName(c.clinicId)}</td>
          <td style={{ padding:8, fontWeight:600 }}>{c.client}</td>
          <td style={{ padding:8, fontSize:12, color:"#7A8592" }}>{c.type}</td>
          <td style={{ padding:8, color:c.signed==="yes"?"#4A9E75":c.signed==="verbal"?"#B07D2A":"#A32D2D", fontWeight:600 }}>{c.signed==="yes"?"Signed":c.signed==="verbal"?"Verbal":"Pending"}</td>
          <td style={{ padding:8, color:"#7A8592", fontSize:12 }}>{c.date||"—"}</td>
          <td style={{ padding:8, color:c.recording==="yes"?"#4A9E75":c.recording==="no"?"#A32D2D":"#7A8592", fontWeight:600 }}>{c.recording==="yes"?"Yes":c.recording==="no"?"No":"N/A"}</td>
        </tr>)}</tbody>
      </table>
    </Card>}
  </div>;
}

function AdminApp({ onLogout }) {
  const [screen,setScreen]=useState("dashboard");
  const [clinics,setClinics]=useLS("ns_clinics",[]);
  const [onboardClinic,setOnboardClinic]=useState(null);

  const startOnboard=c=>{ setOnboardClinic(c); setScreen("onboard"); };

  const nav=[
    {id:"dashboard",icon:"ti-layout-dashboard",lbl:"Dashboard"},
    {id:"clinics",icon:"ti-building-hospital",lbl:"Clinics"},
    {id:"onboard",icon:"ti-user-plus",lbl:"Onboard New Clinic"},
    {id:"compliance",icon:"ti-shield-check",lbl:"Compliance Profiles",sec:"Compliance"},
    {id:"baa",icon:"ti-writing",lbl:"BAA Tracker"},
    {id:"consent",icon:"ti-user-check",lbl:"Consent Records"},
    {id:"settings",icon:"ti-settings",lbl:"Settings",sec:"Account"},
  ];

  const screens={
    dashboard:<Dashboard clinics={clinics} onboard={startOnboard}/>,
    clinics:<div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:".4rem" }}>All <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Clinics</em></div>
      <div style={{ fontSize:13, color:"#7A8592", marginBottom:"2rem" }}>Click a clinic to manage or continue its setup.</div>
      {clinics.length===0?<div style={{ textAlign:"center", padding:"3rem", color:"#AABAC8" }}>No clinics onboarded yet.</div>:clinics.map(c=><ClinicRow key={c.id} clinic={c} onClick={()=>startOnboard(c)}/>)}
    </div>,
    onboard:<OnboardWizard clinics={clinics} setClinics={setClinics} init={onboardClinic} onDone={()=>setScreen("dashboard")}/>,
    compliance:<ComplianceScreen clinics={clinics}/>,
    baa:<BAAScreen/>,
    consent:<ConsentScreen clinics={clinics}/>,
    settings:<div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:300, color:"#1A1C22", marginBottom:"2rem" }}>Admin <em style={{ fontStyle:"italic", color:"#3A5F8A" }}>Settings</em></div>
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Admin credentials</div>
        <div style={{ fontSize:13, color:"#7A8592", marginBottom:"1rem" }}>Username: <strong>narrascribe_admin</strong> · Password: <strong>NSadmin2026</strong></div>
        <div style={{ background:"#FEF6E4", border:"1px solid #E8D098", borderRadius:10, padding:"1rem", fontSize:13, color:"#B07D2A" }}>⚠️ Once Supabase is connected, credentials will be managed through Supabase Auth.</div>
      </Card>
      <Card>
        <div style={{ fontSize:14, fontWeight:600, color:"#1A1C22", marginBottom:"1rem" }}>Reset all data</div>
        <div style={{ fontSize:13, color:"#7A8592", marginBottom:"1rem" }}>Clears all clinic data from this browser.</div>
        <Btn variant="danger" onClick={()=>{ if(window.confirm("Clear all data? This cannot be undone.")){localStorage.clear();window.location.reload();} }}>Clear all data</Btn>
      </Card>
    </div>,
  };

  return <div style={{ minHeight:"100vh", background:"#F6F4F0" }}>
    <nav style={{ background:"#1E1C18", padding:".85rem 2rem", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:100 }}>
      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ width:28, height:28, background:"#5A7FA8", borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center" }}><i className="ti ti-notes" style={{ fontSize:15, color:"#fff" }}/></div>
        <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:500, color:"#fff" }}>Narra<span style={{ color:"#8AAECE" }}>Scribe</span></span>
        <span style={{ fontSize:11, color:"#B07D2A", marginLeft:4 }}>Admin</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:"1rem" }}>
        <span style={{ fontSize:13, color:"rgba(255,255,255,.4)" }}>Ebony N. · CMO</span>
        <button onClick={onLogout} style={{ fontSize:12, color:"rgba(255,255,255,.35)", background:"none", border:"1px solid rgba(255,255,255,.12)", borderRadius:6, padding:"4px 10px", cursor:"pointer", fontFamily:"inherit" }}>Sign out</button>
      </div>
    </nav>
    <div style={{ display:"grid", gridTemplateColumns:"220px 1fr", minHeight:"calc(100vh - 52px)" }}>
      <div style={{ background:"#fff", borderRight:"1px solid #D8D4CC", padding:"1.5rem 0" }}>
        {nav.map(item=><div key={item.id}>
          {item.sec&&<div style={{ fontSize:10, fontWeight:600, letterSpacing:"0.1em", textTransform:"uppercase", color:"#AABAC8", padding:".5rem 1.5rem", marginTop:"1rem" }}>{item.sec}</div>}
          <div onClick={()=>{ setScreen(item.id); if(item.id==="onboard")setOnboardClinic(null); }}
            style={{ display:"flex", alignItems:"center", gap:10, padding:".7rem 1.5rem", fontSize:13, color:screen===item.id?"#3A5F8A":"#445060", cursor:"pointer", borderLeft:`3px solid ${screen===item.id?"#3A5F8A":"transparent"}`, background:screen===item.id?"#E8F1F8":"transparent", fontWeight:screen===item.id?600:400 }}>
            <i className={`ti ${item.icon}`} style={{ fontSize:17, color:screen===item.id?"#3A5F8A":"#AABAC8" }}/>
            {item.lbl}
          </div>
        </div>)}
      </div>
      <div style={{ padding:"2rem", overflowY:"auto" }}>
        {screens[screen]}
      </div>
    </div>
  </div>;
}

function App() {
  const [authed,setAuthed]=useState(()=>sessionStorage.getItem("ns_admin")==="1");
  const login=()=>{ sessionStorage.setItem("ns_admin","1"); setAuthed(true); };
  const logout=()=>{ sessionStorage.removeItem("ns_admin"); setAuthed(false); };
  return authed?<AdminApp onLogout={logout}/>:<Login onLogin={login}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
